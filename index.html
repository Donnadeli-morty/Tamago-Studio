<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PROVISÓRIO: título, descrição e imagem de compartilhamento (spec §13) -->
    <title>TAMAGO Figures &amp; 3D Studio · Figures em resina pintadas à mão</title>
    <meta
      name="description"
      content="Figures de coleção em resina 16K, pintadas à mão e com o seu nome na base. Pronta entrega e sob encomenda, com envio para todo o Brasil."
    />
    <meta name="theme-color" content="#f7eef1" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="TAMAGO Figures · pintadas à mão, com seu nome na base" />
    <meta property="og:description" content="Figures em resina 16K, pintadas à mão, com o seu nome na base." />
    <meta property="og:image" content="/img/mascote/atelier-1200.webp" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Só na home (o prerender tira das outras páginas): a foto do hero é o LCP e começa a baixar antes do JS -->
    <link
      data-so-home
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/img/mascote/atelier-480.avif 480w, /img/mascote/atelier-800.avif 800w, /img/mascote/atelier-1200.avif 1200w"
      imagesizes="(min-width: 768px) 40vw, 64vw"
      fetchpriority="high"
    />
    <!-- No celular o cenário do hero é o maior elemento da primeira tela -->
    <link data-so-home rel="preload" as="image" type="image/avif" href="/img/background-tamago-mobile.avif" media="(max-width: 767px)" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #2b1427">
        Ative o JavaScript para ver as figures, ou chame a TAMAGO no Instagram @tamagofigures.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
